<!DOCTYPE html>
<html>
<head>
    <title>Ticketing App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
        }

        .header {
            background: linear-gradient(90deg, #4b6cb7, #182848);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .tab {
            padding: 10px 20px;
            margin: 0 10px;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tab:hover {
            background: #4b6cb7;
            color: white;
        }

        .container {
            width: 60%;
            margin: auto;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 5px solid #4b6cb7;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background: #4b6cb7;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background: #182848;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1> Ticketing Dashboard 🚀</h1>
    </div>

    <div class="tabs">
        <div class="tab">All Tickets</div>
        <div class="tab">Open</div>
        <div class="tab">Closed</div>
        <div class="tab">Analytics</div>
    </div>

    <div class="container">

        <a class="btn" href="/ticket/new">+ Create New Ticket</a>

        <h3 style="margin-top:20px;">Tickets</h3>

        {% for t in tickets %}
        <div class="card">
            <b>{{ t.title }}</b><br>
            Status: {{ t.status }}
        </div>
        {% endfor %}

    </div>

</body>
</html>
